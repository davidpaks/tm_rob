name: '03 – Két LED felváltva'
version: 1
author: 'Dave'

# Az Arduino lábát (a kód működését) és a LED anódját (a bekötést: vezeték,
# próbapanel, ellenállás) is ellenőrzi. A GND-ág hiányát a szimuláció nem jelzi.
# Minden ellenőrzésnél pontosan az egyik LED ég.
steps:
  - delay: 500ms
  - expect-pin: { part-id: uno, pin: '8', value: 1 }
  - expect-pin: { part-id: led1, pin: 'A', value: 1 }
  - expect-pin: { part-id: uno, pin: '9', value: 0 }
  - expect-pin: { part-id: led2, pin: 'A', value: 0 }
  - delay: 1000ms
  - expect-pin: { part-id: uno, pin: '8', value: 0 }
  - expect-pin: { part-id: led1, pin: 'A', value: 0 }
  - expect-pin: { part-id: uno, pin: '9', value: 1 }
  - expect-pin: { part-id: led2, pin: 'A', value: 1 }
  - delay: 1000ms
  - expect-pin: { part-id: uno, pin: '8', value: 1 }
  - expect-pin: { part-id: led1, pin: 'A', value: 1 }
  - expect-pin: { part-id: uno, pin: '9', value: 0 }
  - expect-pin: { part-id: led2, pin: 'A', value: 0 }
