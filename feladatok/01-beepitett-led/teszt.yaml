name: '01 – Beépített LED villogtatása'
version: 1
author: 'davidpaks'

# A LED 1 s-ig világít, 1 s-ig nem. Az ellenőrzések a váltások között félúton vannak.
steps:
  - delay: 500ms
  - expect-pin: { part-id: uno, pin: '13', value: 1 }
  - delay: 1000ms
  - expect-pin: { part-id: uno, pin: '13', value: 0 }
  - delay: 1000ms
  - expect-pin: { part-id: uno, pin: '13', value: 1 }
  - delay: 1000ms
  - expect-pin: { part-id: uno, pin: '13', value: 0 }
