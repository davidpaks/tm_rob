name: '12 – Két gomb'
version: 1
author: 'davidpaks'

# A gombot a szimulációban nyomja le és engedi fel, és a beépített LED (13-as láb)
# állapotát ellenőrzi. Mivel a gomb a jelvezeték és a GND között kapcsol, a hiányzó
# jelvezetéket és a hiányzó GND-t is jelzi.
steps:
  - delay: 200ms
  - expect-pin: { part-id: uno, pin: '13', value: 0 }
  # zöld: be
  - set-control: { part-id: btn_be, control: pressed, value: 1 }
  - delay: 200ms
  - set-control: { part-id: btn_be, control: pressed, value: 0 }
  - delay: 300ms
  - expect-pin: { part-id: uno, pin: '13', value: 1 }
  # zöld még egyszer: marad be
  - set-control: { part-id: btn_be, control: pressed, value: 1 }
  - delay: 200ms
  - set-control: { part-id: btn_be, control: pressed, value: 0 }
  - delay: 300ms
  - expect-pin: { part-id: uno, pin: '13', value: 1 }
  # piros: ki
  - set-control: { part-id: btn_ki, control: pressed, value: 1 }
  - delay: 200ms
  - set-control: { part-id: btn_ki, control: pressed, value: 0 }
  - delay: 300ms
  - expect-pin: { part-id: uno, pin: '13', value: 0 }
  # piros még egyszer: marad ki
  - set-control: { part-id: btn_ki, control: pressed, value: 1 }
  - delay: 200ms
  - set-control: { part-id: btn_ki, control: pressed, value: 0 }
  - delay: 300ms
  - expect-pin: { part-id: uno, pin: '13', value: 0 }
